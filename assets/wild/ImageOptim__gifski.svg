<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="gifski — GIF encoder based on pngquant. An animation shows a strip of individual frames sliding in and collapsing into a single looping GIF thumbnail.">
  <title>gifski — high-quality GIF encoder</title>
  <desc>A strip of separate animation frames slides in from the right and collapses into one looping GIF thumbnail, next to the gifski wordmark and the tagline "GIF encoder based on pngquant".</desc>

  <defs>
    <!-- Rounded-corner clip for the whole banner -->
    <clipPath id="round">
      <rect x="0" y="0" width="1280" height="360" rx="20" ry="20"/>
    </clipPath>

    <!-- Backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161326"/>
    </linearGradient>

    <!-- gifski-style warm gradient (pink -> orange -> violet) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f9e"/>
      <stop offset="0.5" stop-color="#ff9052"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6aa8"/>
      <stop offset="1" stop-color="#8f63ff"/>
    </linearGradient>

    <!-- scrim behind text -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0.96"/>
      <stop offset="0.62" stop-color="#0d1117" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <!-- one film frame: dark cell + sprocket holes + colored content -->
    <g id="cell">
      <rect x="0" y="0" width="120" height="120" rx="10" fill="#12151d" stroke="#2b3240" stroke-width="1.5"/>
      <rect x="8" y="6" width="10" height="6" rx="2" fill="#242b38"/>
      <rect x="102" y="6" width="10" height="6" rx="2" fill="#242b38"/>
      <rect x="8" y="108" width="10" height="6" rx="2" fill="#242b38"/>
      <rect x="102" y="108" width="10" height="6" rx="2" fill="#242b38"/>
    </g>

    <style>
      .strip     { animation: strip 6s ease-in-out infinite; }
      .thumb     { animation: thumb 6s ease-in-out infinite; }
      .ball      { animation: bounce 1s ease-in-out infinite; }
      .ring      { animation: pulse 6s ease-in-out infinite; }
      .loopIcon  { transform-origin: 1040px 180px; animation: spin 3s linear infinite; }

      /* Frames slide in from the right, then the whole strip shifts left and
         squeezes so the frames stack onto the thumbnail position. */
      @keyframes strip {
        0%      { transform: translateX(360px); opacity: 0; }
        14%     { transform: translateX(0px);   opacity: 1; }
        46%     { transform: translateX(0px);   opacity: 1; }
        /* collapse: pull inward + fade as they merge into the thumbnail */
        66%     { transform: translateX(0px)   scale(1);   opacity: 1; }
        78%     { opacity: 0; }
        80%,100%{ transform: translateX(0px);   opacity: 0; }
      }
      /* individual frame collapse handled per-frame below via .fN */
      .f1 { animation: c1 6s ease-in-out infinite; }
      .f2 { animation: c2 6s ease-in-out infinite; }
      .f3 { animation: c3 6s ease-in-out infinite; }
      .f4 { animation: c4 6s ease-in-out infinite; }
      .f5 { animation: c5 6s ease-in-out infinite; }
      /* each frame starts spread out, then slides to the shared stack point (x=0) */
      @keyframes c1 { 0%,58%{transform:translateX(0)}   72%,100%{transform:translateX(608px)} }
      @keyframes c2 { 0%,58%{transform:translateX(0)}   72%,100%{transform:translateX(456px)} }
      @keyframes c3 { 0%,58%{transform:translateX(0)}   72%,100%{transform:translateX(304px)} }
      @keyframes c4 { 0%,58%{transform:translateX(0)}   72%,100%{transform:translateX(152px)} }
      @keyframes c5 { 0%,58%{transform:translateX(0)}   72%,100%{transform:translateX(0)} }

      /* the resulting looping GIF thumbnail appears as the strip collapses */
      @keyframes thumb {
        0%,66%   { opacity: 0; transform: scale(0.9); }
        76%      { opacity: 1; transform: scale(1.04); }
        82%,100% { opacity: 1; transform: scale(1); }
      }
      /* the little animation "playing" inside the GIF thumbnail */
      @keyframes bounce {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-34px); }
      }
      @keyframes pulse {
        0%,66%,100% { opacity: 0; }
        80%         { opacity: 0.9; }
        92%         { opacity: 0.35; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .strip,.thumb,.ball,.ring,.loopIcon,
        .f1,.f2,.f3,.f4,.f5 { animation: none; }
        .thumb { opacity: 1; transform: none; }
        .ring  { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect x="0" y="0" width="1280" height="360" fill="url(#bg)"/>

    <!-- faint film-perforation texture bottom band -->
    <g fill="#161b24" opacity="0.6">
      <rect x="0" y="330" width="1280" height="30"/>
    </g>

    <!-- ================= RIGHT: the animated concept ================= -->
    <!-- Baseline (static) is the finished, collapsed GIF thumbnail so the
         still frame already looks complete. The strip animates on top. -->

    <!-- Finished looping GIF thumbnail (visible baseline) -->
    <g class="thumb" style="transform-origin:1040px 180px">
      <rect x="960" y="100" width="160" height="160" rx="16" fill="#12151d" stroke="url(#brandV)" stroke-width="3"/>
      <clipPath id="tclip"><rect x="964" y="104" width="152" height="152" rx="13"/></clipPath>
      <g clip-path="url(#tclip)">
        <rect x="964" y="104" width="152" height="152" fill="#1a1030"/>
        <rect x="964" y="200" width="152" height="56" fill="#241640"/>
        <circle class="ball" cx="1040" cy="196" r="20" fill="url(#brand)"/>
      </g>
      <!-- loop badge -->
      <g class="loopIcon" fill="none" stroke="#ff9052" stroke-width="4" stroke-linecap="round">
        <path d="M1024 172 a16 16 0 1 1 -4 -10"/>
        <path d="M1020 150 l6 12 -13 2" fill="#ff9052" stroke="none"/>
      </g>
    </g>
    <!-- pulse ring emitted at the moment of collapse -->
    <circle class="ring" cx="1040" cy="180" r="96" fill="none" stroke="url(#brand)" stroke-width="3"/>

    <!-- The incoming strip of individual frames -->
    <g class="strip">
      <!-- connective film base behind cells -->
      <g class="f1"><g transform="translate(432,120)"><use href="#cell"/><rect x="18" y="18" width="84" height="84" rx="6" fill="#231038"/><circle cx="60" cy="90" r="14" fill="#ff5f9e"/></g></g>
      <g class="f2"><g transform="translate(584,120)"><use href="#cell"/><rect x="18" y="18" width="84" height="84" rx="6" fill="#231038"/><circle cx="60" cy="74" r="14" fill="#ff7f6a"/></g></g>
      <g class="f3"><g transform="translate(736,120)"><use href="#cell"/><rect x="18" y="18" width="84" height="84" rx="6" fill="#231038"/><circle cx="60" cy="56" r="14" fill="#ff9052"/></g></g>
      <g class="f4"><g transform="translate(888,120)"><use href="#cell"/><rect x="18" y="18" width="84" height="84" rx="6" fill="#231038"/><circle cx="60" cy="74" r="14" fill="#c072ff"/></g></g>
      <g class="f5"><g transform="translate(1040,120)"><use href="#cell"/><rect x="18" y="18" width="84" height="84" rx="6" fill="#231038"/><circle cx="60" cy="90" r="14" fill="#a06bff"/></g></g>
    </g>

    <!-- ================= LEFT: text with scrim ================= -->
    <rect x="0" y="0" width="820" height="360" fill="url(#scrim)"/>

    <!-- little frame-stack glyph next to wordmark -->
    <g transform="translate(72,150)">
      <rect x="16" y="16" width="52" height="52" rx="8" fill="none" stroke="#a06bff" stroke-width="3" opacity="0.55"/>
      <rect x="8"  y="8"  width="52" height="52" rx="8" fill="none" stroke="#ff9052" stroke-width="3" opacity="0.8"/>
      <rect x="0"  y="0"  width="52" height="52" rx="8" fill="#12151d" stroke="url(#brandV)" stroke-width="3"/>
      <circle cx="26" cy="30" r="11" fill="url(#brand)"/>
    </g>

    <text x="164" y="176" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="104" font-weight="800" letter-spacing="-2" fill="url(#brand)">gifski</text>

    <text x="168" y="230" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="27" font-weight="600" fill="#e8ebf2">GIF encoder based on pngquant</text>
    <text x="168" y="266" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="400" fill="#98a2b3">Per-frame palettes for the highest-quality animated GIFs.</text>

    <!-- crisp rounded border on top -->
    <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#2b3240" stroke-width="2"/>
  </g>
</svg>
