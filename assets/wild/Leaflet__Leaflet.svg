<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Leaflet — a JavaScript library for interactive maps. Map tiles fade in, a location pin drops and bounces on a gently zooming map.">
  <title>Leaflet</title>
  <desc>Dark hero banner for the Leaflet open-source project: an interactive map made of grid tiles fades in and gently zooms while a green location pin drops and bounces into place, beside the Leaflet wordmark and the tagline "A JS library for interactive maps".</desc>

  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1280" height="360" rx="20"/></clipPath>
    <clipPath id="mapClip"><rect x="0" y="0" width="1280" height="360" rx="20"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a12"/>
    </linearGradient>

    <!-- water / land base under the tile grid -->
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13351f"/>
      <stop offset="0.55" stop-color="#0f2a1a"/>
      <stop offset="1" stop-color="#0c2233"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#199900"/>
      <stop offset="1" stop-color="#96c93d"/>
    </linearGradient>

    <linearGradient id="wordFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#96c93d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#96c93d" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <style>
      .tile{ opacity:0; animation: tileIn 6s ease-in-out infinite; }
      @keyframes tileIn{
        0%   { opacity:0; }
        12%  { opacity:1; }
        82%  { opacity:1; }
        100% { opacity:0; }
      }

      /* gentle zoom of the whole map */
      .mapzoom{ transform-box: view-box; transform-origin: 470px 190px;
                animation: zoom 14s ease-in-out infinite; }
      @keyframes zoom{
        0%,100%{ transform: scale(1); }
        50%    { transform: scale(1.06); }
      }

      /* pin drop + bounce */
      .pin{ transform-box: view-box; transform-origin: 470px 300px;
            animation: drop 6s cubic-bezier(.5,.05,.3,1) infinite; }
      @keyframes drop{
        0%   { transform: translateY(-240px); opacity:0; }
        14%  { transform: translateY(-240px); opacity:0; }
        20%  { opacity:1; }
        40%  { transform: translateY(0); }
        48%  { transform: translateY(-34px); }
        56%  { transform: translateY(0); }
        62%  { transform: translateY(-12px); }
        68%  { transform: translateY(0); }
        92%  { transform: translateY(0); opacity:1; }
        100% { transform: translateY(0); opacity:0; }
      }

      .ripple{ transform-box: view-box; transform-origin: 470px 300px;
               animation: ripple 6s ease-out infinite; }
      @keyframes ripple{
        0%,40%{ transform: scale(0.2); opacity:0; }
        56%   { transform: scale(1);   opacity:0.7; }
        80%   { transform: scale(2.6); opacity:0; }
        100%  { opacity:0; }
      }

      .scan{ animation: scan 6s ease-in-out infinite; }
      @keyframes scan{ 0%,100%{opacity:0.0} 50%{opacity:0.35} }

      @media (prefers-reduced-motion: reduce){
        .tile,.mapzoom,.pin,.ripple,.scan{ animation:none !important; }
        .tile{ opacity:1; }
        .pin{ transform:none; opacity:1; }
        .ripple{ opacity:0; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>

    <!-- ===== MAP CANVAS (left / center) ===== -->
    <g clip-path="url(#mapClip)">
      <g class="mapzoom">
        <rect x="-40" y="-40" width="1000" height="440" fill="url(#land)"/>

        <!-- a stylized river / coastline for map flavor -->
        <path d="M-40 120 C 160 90, 240 200, 430 180 S 720 120, 940 170"
              fill="none" stroke="#0c2a44" stroke-width="34" stroke-linecap="round" opacity="0.9"/>
        <path d="M-40 260 C 200 250, 300 300, 520 285 S 760 250, 940 300"
              fill="none" stroke="#0c2a44" stroke-width="22" stroke-linecap="round" opacity="0.7"/>

        <!-- fading tile grid: 8 cols x 4 rows -->
        <g stroke="#3ddc84" stroke-opacity="0.16" fill="none">
          <!-- Row 0 -->
          <rect class="tile" style="animation-delay:0.00s"   x="0"   y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.10s"   x="120" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.20s"   x="240" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.30s"   x="360" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.40s"   x="480" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.50s"   x="600" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.60s"   x="720" y="0"   width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.70s"   x="840" y="0"   width="120" height="90"/>
          <!-- Row 1 -->
          <rect class="tile" style="animation-delay:0.08s"   x="0"   y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.18s"   x="120" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.28s"   x="240" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.38s"   x="360" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.48s"   x="480" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.58s"   x="600" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.68s"   x="720" y="90"  width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.78s"   x="840" y="90"  width="120" height="90"/>
          <!-- Row 2 -->
          <rect class="tile" style="animation-delay:0.16s"   x="0"   y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.26s"   x="120" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.36s"   x="240" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.46s"   x="360" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.56s"   x="480" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.66s"   x="600" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.76s"   x="720" y="180" width="120" height="90"/>
          <rect class="tile" style="animation-delay:0.86s"   x="840" y="180" width="120" height="90"/>
          <!-- Row 3 -->
          <rect class="tile" style="animation-delay:0.24s"   x="0"   y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.34s"   x="120" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.44s"   x="240" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.54s"   x="360" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.64s"   x="480" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.74s"   x="600" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.84s"   x="720" y="270" width="120" height="130"/>
          <rect class="tile" style="animation-delay:0.94s"   x="840" y="270" width="120" height="130"/>
        </g>

        <!-- roads -->
        <g stroke-linecap="round" fill="none" opacity="0.5">
          <path d="M60 40 L 900 330" stroke="#2f9e60" stroke-width="3"/>
          <path d="M20 300 L 700 20"  stroke="#2f9e60" stroke-width="3"/>
          <path d="M470 -20 L 470 400" stroke="#2f9e60" stroke-width="2.5"/>
        </g>

        <!-- ripple under the pin -->
        <circle class="ripple" cx="470" cy="300" r="18" fill="none" stroke="#96c93d" stroke-width="3"/>
      </g>
    </g>

    <!-- scan sheen sweeping across the map -->
    <rect class="scan" x="0" y="0" width="1280" height="360" fill="url(#pinGlow)" opacity="0"/>

    <!-- ===== LOCATION PIN (drops onto 470,300) ===== -->
    <g class="pin">
      <ellipse cx="470" cy="303" rx="40" ry="16" fill="url(#pinGlow)"/>
      <path d="M470 300
               C 448 268, 438 250, 438 232
               a 32 32 0 1 1 64 0
               C 502 250, 492 268, 470 300 Z"
            fill="url(#leafGrad)" stroke="#0d1117" stroke-width="3"/>
      <circle cx="470" cy="230" r="12" fill="#0d1117"/>
      <circle cx="470" cy="230" r="6" fill="#eafce0"/>
    </g>

    <!-- ===== TEXT PANEL (right) ===== -->
    <rect x="760" y="0" width="520" height="360" fill="url(#wordFade)" opacity="0.0"/>
    <rect x="812" y="96" width="470" height="170" rx="16" fill="#0d1117" opacity="0.72"/>

    <!-- little leaf mark by the wordmark -->
    <g transform="translate(840,150)">
      <path d="M0 34 C 0 10, 20 -6, 44 -6 C 44 18, 24 34, 0 34 Z"
            fill="url(#leafGrad)"/>
      <path d="M6 30 C 18 18, 30 10, 42 -2" stroke="#0d1117" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <text x="900" y="182" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="76" font-weight="700" fill="#f2fbe9" letter-spacing="0.5">Leaflet</text>
    <text x="902" y="224" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="24" font-weight="500" fill="#96c93d">A JS library for interactive maps</text>

    <!-- inner border for polish -->
    <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#96c93d" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
