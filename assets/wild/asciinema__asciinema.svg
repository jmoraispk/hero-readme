<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img"
     aria-label="asciinema — record and share terminal sessions. A terminal window replays a recorded session while commands type out over a scrubbing progress bar.">
  <title>asciinema</title>
  <desc>Animated hero banner: a dark terminal window replays a recorded session. Commands type out line by line, a blinking REC indicator counts elapsed time, and a playhead sweeps a progress bar at the bottom, illustrating recording and sharing terminal sessions.</desc>

  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="1280" height="360" rx="20"/>
    </clipPath>
    <clipPath id="term">
      <rect x="60" y="92" width="720" height="216" rx="12"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="scrub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#56d364" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#56d364" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#3fb0e6"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace; }
      .ui   { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }

      /* line-by-line typing reveal, synced to a 9s replay loop */
      .line { clip-path: inset(0 100% 0 0); }
      .l1 { animation: rev 9s linear infinite;  animation-delay: 0.2s; }
      .l2 { animation: rev 9s linear infinite;  animation-delay: 1.4s; }
      .l3 { animation: rev 9s linear infinite;  animation-delay: 2.7s; }
      .l4 { animation: rev 9s linear infinite;  animation-delay: 4.0s; }
      .l5 { animation: rev 9s linear infinite;  animation-delay: 5.3s; }
      /* each line hides then reveals within its own 9s cycle window */
      @keyframes rev {
        0%   { clip-path: inset(0 100% 0 0); }
        4%   { clip-path: inset(0 100% 0 0); }
        13%  { clip-path: inset(0 0 0 0); }
        94%  { clip-path: inset(0 0 0 0); }
        95%  { clip-path: inset(0 100% 0 0); }
        100% { clip-path: inset(0 100% 0 0); }
      }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .rec { animation: recblink 1.4s ease-in-out infinite; transform-origin: center; }
      @keyframes recblink { 0%,100%{opacity:1} 50%{opacity:0.25} }

      .head { animation: sweep 9s linear infinite; }
      @keyframes sweep { 0%{transform:translateX(0)} 100%{transform:translateX(628px)} }

      .fill { animation: grow 9s linear infinite; }
      @keyframes grow { 0%{width:0} 100%{width:628px} }

      .cursorglow { animation: gmove 9s linear infinite, gpulse 1.4s ease-in-out infinite; }
      @keyframes gmove { 0%{transform:translateX(0)} 100%{transform:translateX(628px)} }
      @keyframes gpulse { 0%,100%{opacity:0.5} 50%{opacity:0.9} }

      @media (prefers-reduced-motion: reduce) {
        .line { clip-path: inset(0 0 0 0) !important; }
        .l1,.l2,.l3,.l4,.l5,.caret,.rec,.head,.fill,.cursorglow { animation: none !important; }
        .fill { width: 372px !important; }
        .head { transform: translateX(372px) !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- backdrop -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <ellipse cx="1000" cy="120" rx="360" ry="240" fill="url(#glow)" opacity="0.20"/>

    <!-- subtle grid of faint scanlines suggesting the terminal medium -->
    <g stroke="#1b2434" stroke-width="1" opacity="0.5">
      <line x1="0" y1="90"  x2="1280" y2="90"/>
      <line x1="0" y1="180" x2="1280" y2="180"/>
      <line x1="0" y1="270" x2="1280" y2="270"/>
    </g>

    <!-- ===================== TERMINAL WINDOW ===================== -->
    <g>
      <rect x="60" y="60" width="720" height="248" rx="14" fill="#0a0e16" stroke="#222c3a" stroke-width="1.5"/>
      <!-- title bar -->
      <path d="M60 74 a14 14 0 0 1 14 -14 h692 a14 14 0 0 1 14 14 v18 h-720 z" fill="#111826"/>
      <circle cx="82"  cy="77" r="6" fill="#ff5f56"/>
      <circle cx="102" cy="77" r="6" fill="#ffbd2e"/>
      <circle cx="122" cy="77" r="6" fill="#27c93f"/>
      <text x="420" y="82" text-anchor="middle" class="mono" font-size="13" fill="#aab4c2">demo.cast — asciinema player</text>

      <!-- REC badge -->
      <g>
        <circle class="rec" cx="710" cy="77" r="6" fill="#ff6b62"/>
        <text x="722" y="82" class="mono" font-size="12" font-weight="700" fill="#ff9d94">REC</text>
      </g>

      <!-- terminal body -->
      <g clip-path="url(#term)">
        <rect x="60" y="92" width="720" height="216" fill="#080b12"/>

        <g class="mono" font-size="16">
          <!-- line 1 -->
          <g class="line l1">
            <text x="82" y="112" fill="#56d364">$</text>
            <text x="100" y="112" fill="#c9d1d9">asciinema rec </text>
            <text x="238" y="112" fill="#58a6ff">demo.cast</text>
          </g>
          <!-- line 2 -->
          <g class="line l2">
            <text x="82" y="140" fill="#8b949e">~ recording started · press ^D to finish</text>
          </g>
          <!-- line 3 -->
          <g class="line l3">
            <text x="82" y="168" fill="#56d364">$</text>
            <text x="100" y="168" fill="#c9d1d9">cargo build --release</text>
          </g>
          <!-- line 4 -->
          <g class="line l4">
            <text x="82" y="196" fill="#3fb950">✓</text>
            <text x="100" y="196" fill="#8b949e">Compiled asciinema v3.0 in 1.24s</text>
          </g>
          <!-- line 5 -->
          <g class="line l5">
            <text x="82" y="224" fill="#56d364">$</text>
            <text x="100" y="224" fill="#c9d1d9">asciinema play </text>
            <text x="245" y="224" fill="#58a6ff">demo.cast</text>
          </g>
        </g>

        <!-- blinking prompt caret -->
        <rect class="caret" x="82" y="240" width="9" height="17" fill="#56d364"/>
      </g>

      <!-- ===== scrub / progress bar ===== -->
      <g>
        <rect x="82" y="284" width="628" height="4" rx="2" fill="#1c2636"/>
        <rect class="fill" x="82" y="284" width="372" height="4" rx="2" fill="url(#scrub)"/>
        <!-- moving playhead -->
        <g class="head">
          <circle class="cursorglow" cx="82" cy="286" r="10" fill="url(#glow)"/>
          <circle cx="82" cy="286" r="6" fill="#e6edf3"/>
          <circle cx="82" cy="286" r="6" fill="none" stroke="#56d364" stroke-width="1.5"/>
        </g>
        <text x="716" y="290" class="mono" font-size="11" fill="#6b7683">0:09</text>
      </g>
    </g>

    <!-- ===================== WORDMARK / MESSAGE ===================== -->
    <g transform="translate(812,120)">
      <!-- asciinema play-button mark -->
      <g transform="translate(0,-8)">
        <circle cx="26" cy="26" r="26" fill="#0f1622" stroke="#243040" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="21" fill="none" stroke="url(#mark)" stroke-width="2" opacity="0.85"/>
        <path d="M21 16 L38 26 L21 36 Z" fill="url(#mark)"/>
        <circle cx="16" cy="26" r="3.2" fill="#0f1622"/>
      </g>

      <text x="66" y="18" class="ui" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="0.5">ascii<tspan fill="#56d364">nema</tspan></text>

      <text x="2" y="78" class="ui" font-size="20" font-weight="600" fill="#c9d1d9">Record and share terminal sessions</text>
      <text x="2" y="108" class="ui" font-size="14" fill="#9198a3">Lightweight, text-based recordings you can replay and share.</text>

      <!-- small tag chips -->
      <g class="ui" font-size="12" fill="#7ee2a8">
        <rect x="2"   y="128" width="70" height="24" rx="12" fill="#12281c" stroke="#1f4a30"/>
        <text x="37"  y="144" text-anchor="middle">rec</text>
        <rect x="82"  y="128" width="76" height="24" rx="12" fill="#0f2233" stroke="#1d3b52"/>
        <text x="120" y="144" text-anchor="middle" fill="#7cc4ff">play</text>
        <rect x="168" y="128" width="92" height="24" rx="12" fill="#221a2e" stroke="#3a2c4c"/>
        <text x="214" y="144" text-anchor="middle" fill="#c9a7f0">.cast</text>
      </g>
    </g>

    <!-- outline -->
    <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="#222c3a" stroke-width="1"/>
  </g>
</svg>
