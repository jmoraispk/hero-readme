<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img"
     aria-label="D3 — bring data to life with SVG, Canvas and HTML. Animated hero showing bars growing from numbers and nodes settling into a force-directed layout.">
  <title>D3 — Data-Driven Documents</title>
  <desc>A dark banner: on the left, numbers flow into a bar chart whose bars grow from a baseline; on the right, connected nodes settle into a force-directed layout. The wordmark "D3" sits over a scrim with the tagline "Bring data to life with SVG, Canvas and HTML".</desc>

  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1280" height="360" rx="20"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141c"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d3c"/>
      <stop offset="0.55" stop-color="#ff7f0e"/>
      <stop offset="1" stop-color="#f25c2a"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f77b4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f77b4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f16" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#0b0f16" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0b0f16" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* ---- bars grow from the baseline, driven by their numbers ---- */
      .bar{ transform-box: fill-box; transform-origin: 50% 100%;
            animation: grow 4.6s ease-in-out infinite; }
      @keyframes grow{
        0%   { transform: scaleY(0); }
        28%  { transform: scaleY(1); }
        70%  { transform: scaleY(1); }
        100% { transform: scaleY(0); }
      }

      /* ---- numbers streaming into the chart ---- */
      .num{ animation: flow 5.2s linear infinite; }
      @keyframes flow{
        0%   { transform: translate(0,0); opacity:0; }
        12%  { opacity:0.9; }
        80%  { opacity:0.9; }
        100% { transform: translate(150px,-46px); opacity:0; }
      }

      /* ---- force nodes settling: perpetual equilibrium jitter ---- */
      .node{ animation: settle 6s ease-in-out infinite; }
      @keyframes settle{
        0%   { transform: translate(var(--dx), var(--dy)); }
        50%  { transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1)); }
        100% { transform: translate(var(--dx), var(--dy)); }
      }

      /* ---- links: gentle data-flow shimmer ---- */
      .link{ stroke-dasharray: 6 8; animation: dash 3.2s linear infinite; }
      @keyframes dash{ to { stroke-dashoffset: -56; } }

      .pulse{ transform-box: fill-box; transform-origin: 50% 50%;
              animation: pulse 6s ease-in-out infinite; }
      @keyframes pulse{
        0%,100%{ transform: scale(1); opacity:0.9; }
        50%    { transform: scale(1.18); opacity:1; }
      }

      /* ---- static frame already looks finished ---- */
      @media (prefers-reduced-motion: reduce){
        .bar,.num,.node,.link,.pulse{ animation: none !important; }
        .num{ opacity: 0.9; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- backdrop -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <ellipse cx="990" cy="185" rx="340" ry="240" fill="url(#glow)"/>

    <!-- subtle grid -->
    <g stroke="#20293a" stroke-width="1">
      <line x1="70" y1="310" x2="1210" y2="310"/>
      <line x1="70" y1="258" x2="560" y2="258"/>
      <line x1="70" y1="206" x2="560" y2="206"/>
      <line x1="70" y1="154" x2="560" y2="154"/>
    </g>

    <!-- ===================== BAR CHART: numbers -> bars ===================== -->
    <!-- baseline at y=310 ; each bar grows from its own bottom -->
    <g>
      <rect class="bar" x="80"  y="250" width="30" height="60"  rx="4" fill="#1f77b4" style="animation-delay:0s"/>
      <rect class="bar" x="120" y="190" width="30" height="120" rx="4" fill="#ff7f0e" style="animation-delay:.18s"/>
      <rect class="bar" x="160" y="220" width="30" height="90"  rx="4" fill="#2ca02c" style="animation-delay:.36s"/>
      <rect class="bar" x="200" y="160" width="30" height="150" rx="4" fill="#d62728" style="animation-delay:.54s"/>
      <rect class="bar" x="240" y="200" width="30" height="110" rx="4" fill="#9467bd" style="animation-delay:.72s"/>
      <rect class="bar" x="280" y="230" width="30" height="80"  rx="4" fill="#17becf" style="animation-delay:.90s"/>
      <rect class="bar" x="320" y="170" width="30" height="140" rx="4" fill="#e377c2" style="animation-delay:1.08s"/>
      <rect class="bar" x="360" y="210" width="30" height="100" rx="4" fill="#bcbd22" style="animation-delay:1.26s"/>
      <rect class="bar" x="400" y="150" width="30" height="160" rx="4" fill="#1f77b4" style="animation-delay:1.44s"/>
      <rect class="bar" x="440" y="240" width="30" height="70"  rx="4" fill="#ff7f0e" style="animation-delay:1.62s"/>
      <rect class="bar" x="480" y="180" width="30" height="130" rx="4" fill="#2ca02c" style="animation-delay:1.80s"/>
      <rect class="bar" x="520" y="215" width="30" height="95"  rx="4" fill="#d62728" style="animation-delay:1.98s"/>
    </g>

    <!-- numeric stream feeding the chart -->
    <g font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="14" fill="#7d8aa0">
      <text class="num" x="60"  y="300" style="animation-delay:0s">0.62</text>
      <text class="num" x="60"  y="255" style="animation-delay:1.1s">1.20</text>
      <text class="num" x="60"  y="205" style="animation-delay:2.0s">1.55</text>
      <text class="num" x="60"  y="330" style="animation-delay:2.9s">0.90</text>
      <text class="num" x="60"  y="180" style="animation-delay:3.7s">1.40</text>
      <text class="num" x="60"  y="280" style="animation-delay:4.4s">0.71</text>
    </g>

    <!-- ===================== FORCE LAYOUT: nodes settle ===================== -->
    <g stroke-linecap="round">
      <!-- links drawn at settled positions -->
      <g class="link" stroke="#3a4a5e" >
        <line x1="985" y1="185" x2="905" y2="140" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="985" y1="185" x2="1005" y2="112" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="985" y1="185" x2="1082" y2="182" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="985" y1="185" x2="1030" y2="252" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="985" y1="185" x2="942" y2="242" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="985" y1="185" x2="862" y2="210" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="1005" y1="112" x2="1120" y2="108" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="1082" y1="182" x2="1030" y2="252" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="942" y1="242" x2="862" y2="210" class="link" stroke="#38507a" stroke-width="2"/>
        <line x1="905" y1="140" x2="862" y2="210" class="link" stroke="#38507a" stroke-width="2"/>
      </g>

      <!-- nodes -->
      <g stroke="#0b0f16" stroke-width="2">
        <g class="node" style="--dx:12px;--dy:-9px;animation-delay:.0s"><circle cx="905" cy="140" r="14" fill="#1f77b4"/></g>
        <g class="node" style="--dx:-10px;--dy:-13px;animation-delay:.5s"><circle cx="1005" cy="112" r="12" fill="#ff7f0e"/></g>
        <g class="node" style="--dx:14px;--dy:6px;animation-delay:1.0s"><circle cx="1082" cy="182" r="13" fill="#2ca02c"/></g>
        <g class="node" style="--dx:-8px;--dy:14px;animation-delay:1.5s"><circle cx="1030" cy="252" r="12" fill="#d62728"/></g>
        <g class="node" style="--dx:9px;--dy:12px;animation-delay:2.0s"><circle cx="942" cy="242" r="11" fill="#9467bd"/></g>
        <g class="node" style="--dx:-13px;--dy:-6px;animation-delay:2.5s"><circle cx="862" cy="210" r="13" fill="#17becf"/></g>
        <g class="node" style="--dx:-11px;--dy:-10px;animation-delay:3.0s"><circle cx="1120" cy="108" r="10" fill="#e377c2"/></g>
        <!-- hub -->
        <g class="pulse"><circle cx="985" cy="185" r="18" fill="url(#brand)"/></g>
      </g>
    </g>

    <!-- ===================== WORDMARK + TAGLINE ===================== -->
    <rect x="0" y="0" width="640" height="360" fill="url(#scrim)"/>
    <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
      <text x="70" y="98" font-size="92" font-weight="800" fill="url(#brand)" letter-spacing="-2">D3</text>
      <text x="196" y="98" font-size="30" font-weight="600" fill="#e6edf3">Data-Driven Documents</text>
      <text x="72" y="128" font-size="21" font-weight="400" fill="#9aa7bd">Bring data to life with SVG, Canvas &amp; HTML.</text>
    </g>

    <!-- crisp rounded border -->
    <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#222c3c" stroke-width="2"/>
  </g>
</svg>
