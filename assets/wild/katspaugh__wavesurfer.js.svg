    <!-- ===== playhead (SMIL sweep) ===== -->
    <g>
      <rect x="-2" y="40" width="4" height="280" fill="url(#phead)">
        <animate attributeName="x" values="88;1176;1176;88"
                 keyTimes="0;0.85;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <circle cx="90" cy="180" r="7" fill="#ffffff">
        <animate attributeName="cx" values="90;1178;1178;90"
                 keyTimes="0;0.85;0.92;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="180" r="13" fill="none" stroke="#ffb457" stroke-width="2" opacity="0.7">
        <animate attributeName="cx" values="90;1178;1178;90"
                 keyTimes="0;0.85;0.92;1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== left scrim + wordmark ===== -->
    <rect x="0" y="0" width="560" height="360" fill="url(#scrim)"/>

    <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
      <!-- small mark: three mini bars -->
      <g>
        <rect x="60" y="128" width="7" height="24" rx="3.5" fill="#5eead4"/>
        <rect x="71" y="116" width="7" height="48" rx="3.5" fill="#7dd3c8"/>
        <rect x="82" y="134" width="7" height="12" rx="3.5" fill="#f9703e"/>
