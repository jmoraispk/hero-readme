        <rect class="bar" x="618"  y="82"  width="10" height="196" rx="5" style="animation:eq 1.4s ease-in-out -0.15s infinite;"/>
        <rect class="bar" x="640"  y="124" width="10" height="112" rx="5" style="animation:eq 1.4s ease-in-out -0.27s infinite;"/>
        <rect class="bar" x="662"  y="64"  width="10" height="232" rx="5" style="animation:eq 1.4s ease-in-out -0.39s infinite;"/>
        <rect class="bar" x="684"  y="134" width="10" height="92"  rx="5" style="animation:eq 1.4s ease-in-out -0.51s infinite;"/>
        <rect class="bar" x="706"  y="100" width="10" height="160" rx="5" style="animation:eq 1.4s ease-in-out -0.63s infinite;"/>
