<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img"
     aria-label="wavesurfer.js — audio waveform player. An animated waveform draws across a dark banner and its bars pulse like an equalizer while a playhead sweeps left to right.">
  <title>wavesurfer.js</title>
  <desc>Dark hero banner for wavesurfer.js. A teal-to-orange audio waveform of vertical bars pulses like an equalizer while a bright playhead sweeps across, revealing played bars in warm orange. The project name and tagline "Audio waveform player" sit on the left.</desc>

  <defs>
    <!-- rounded-corner clip -->
    <clipPath id="round">
      <rect x="0" y="0" width="1280" height="360" rx="20" ry="20"/>
    </clipPath>

    <!-- background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>

    <!-- unplayed (ahead of playhead) waveform gradient: teal -->
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22a3b8"/>
    </linearGradient>

    <!-- played (behind playhead) waveform gradient: warm orange -->
    <linearGradient id="played" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#f9703e"/>
    </linearGradient>

    <!-- left scrim behind text -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="phead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#ffe9c7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <style>
      .bar { transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.38); }
        50%      { transform: scaleY(1); }
      }
      @keyframes draw {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar, .anim { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <ellipse cx="820" cy="180" rx="620" ry="300" fill="url(#glow)"/>

    <!-- center baseline -->
    <rect x="60" y="179.5" width="1160" height="1" fill="#8b949e" opacity="0.18"/>

    <!-- ===== waveform: mirrored equalizer bars around y=180 ===== -->
    <!-- Each bar animates its scaleY (eq pulse) and appears via a draw delay (SMIL-free via CSS). -->
    <g>
      <!--
        Bars are generated across x=90..1190. Two layers:
        (a) teal "unplayed" bars (always present, static frame full height)
        (b) orange "played" bars clipped by a sweeping reveal that follows the playhead
      -->
      <!-- TEAL base layer -->
      <g fill="url(#wave)">
        <rect class="bar" x="90"   y="120" width="10" height="120" rx="5" style="animation:eq 1.4s ease-in-out -0.00s infinite;"/>
        <rect class="bar" x="112"  y="96"  width="10" height="168" rx="5" style="animation:eq 1.4s ease-in-out -0.12s infinite;"/>
        <rect class="bar" x="134"  y="140" width="10" height="80"  rx="5" style="animation:eq 1.4s ease-in-out -0.24s infinite;"/>
