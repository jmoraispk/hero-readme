        <rect class="bar" x="728"  y="146" width="10" height="68"  rx="5" style="animation:eq 1.4s ease-in-out -0.75s infinite;"/>
        <rect class="bar" x="750"  y="76"  width="10" height="208" rx="5" style="animation:eq 1.4s ease-in-out -0.87s infinite;"/>
        <rect class="bar" x="772"  y="118" width="10" height="124" rx="5" style="animation:eq 1.4s ease-in-out -0.99s infinite;"/>
        <rect class="bar" x="794"  y="154" width="10" height="52"  rx="5" style="animation:eq 1.4s ease-in-out -1.11s infinite;"/>
        <rect class="bar" x="816"  y="88"  width="10" height="184" rx="5" style="animation:eq 1.4s ease-in-out -1.23s infinite;"/>
        <rect class="bar" x="838"  y="130" width="10" height="100" rx="5" style="animation:eq 1.4s ease-in-out -0.09s infinite;"/>
        <rect class="bar" x="860"  y="68"  width="10" height="224" rx="5" style="animation:eq 1.4s ease-in-out -0.21s infinite;"/>
        <rect class="bar" x="882"  y="136" width="10" height="88"  rx="5" style="animation:eq 1.4s ease-in-out -0.33s infinite;"/>
        <rect class="bar" x="904"  y="104" width="10" height="152" rx="5" style="animation:eq 1.4s ease-in-out -0.45s infinite;"/>
        <rect class="bar" x="926"  y="150" width="10" height="60"  rx="5" style="animation:eq 1.4s ease-in-out -0.57s infinite;"/>
        <rect class="bar" x="948"  y="80"  width="10" height="200" rx="5" style="animation:eq 1.4s ease-in-out -0.69s infinite;"/>
        <rect class="bar" x="970"  y="120" width="10" height="120" rx="5" style="animation:eq 1.4s ease-in-out -0.81s infinite;"/>
        <rect class="bar" x="992"  y="70"  width="10" height="220" rx="5" style="animation:eq 1.4s ease-in-out -0.93s infinite;"/>
        <rect class="bar" x="1014" y="142" width="10" height="76"  rx="5" style="animation:eq 1.4s ease-in-out -1.05s infinite;"/>
        <rect class="bar" x="1036" y="94"  width="10" height="172" rx="5" style="animation:eq 1.4s ease-in-out -1.17s infinite;"/>
        <rect class="bar" x="1058" y="132" width="10" height="96"  rx="5" style="animation:eq 1.4s ease-in-out -1.29s infinite;"/>
        <rect class="bar" x="1080" y="62"  width="10" height="236" rx="5" style="animation:eq 1.4s ease-in-out -0.05s infinite;"/>
        <rect class="bar" x="1102" y="126" width="10" height="108" rx="5" style="animation:eq 1.4s ease-in-out -0.17s infinite;"/>
        <rect class="bar" x="1124" y="98"  width="10" height="164" rx="5" style="animation:eq 1.4s ease-in-out -0.29s infinite;"/>
        <rect class="bar" x="1146" y="148" width="10" height="64"  rx="5" style="animation:eq 1.4s ease-in-out -0.41s infinite;"/>
        <rect class="bar" x="1168" y="86"  width="10" height="188" rx="5" style="animation:eq 1.4s ease-in-out -0.53s infinite;"/>
      </g>

      <!-- ORANGE played layer: identical bars, revealed by sweeping clip -->
      <clipPath id="reveal">
        <rect x="90" y="0" width="0" height="360">
          <animate class="anim" attributeName="width"
                   values="0;1088;1088;0"
                   keyTimes="0;0.85;0.92;1"
                   dur="7s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
      <g fill="url(#played)" clip-path="url(#reveal)">
        <rect class="bar" x="90"   y="120" width="10" height="120" rx="5" style="animation:eq 1.4s ease-in-out -0.00s infinite;"/>
        <rect class="bar" x="112"  y="96"  width="10" height="168" rx="5" style="animation:eq 1.4s ease-in-out -0.12s infinite;"/>
        <rect class="bar" x="134"  y="140" width="10" height="80"  rx="5" style="animation:eq 1.4s ease-in-out -0.24s infinite;"/>
        <rect class="bar" x="156"  y="72"  width="10" height="216" rx="5" style="animation:eq 1.4s ease-in-out -0.36s infinite;"/>
        <rect class="bar" x="178"  y="110" width="10" height="140" rx="5" style="animation:eq 1.4s ease-in-out -0.48s infinite;"/>
        <rect class="bar" x="200"  y="150" width="10" height="60"  rx="5" style="animation:eq 1.4s ease-in-out -0.60s infinite;"/>
