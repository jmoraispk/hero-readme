        <rect class="bar" x="178"  y="110" width="10" height="140" rx="5" style="animation:eq 1.4s ease-in-out -0.48s infinite;"/>
        <rect class="bar" x="200"  y="150" width="10" height="60"  rx="5" style="animation:eq 1.4s ease-in-out -0.60s infinite;"/>
        <rect class="bar" x="222"  y="84"  width="10" height="192" rx="5" style="animation:eq 1.4s ease-in-out -0.72s infinite;"/>
        <rect class="bar" x="244"  y="126" width="10" height="108" rx="5" style="animation:eq 1.4s ease-in-out -0.84s infinite;"/>
        <rect class="bar" x="266"  y="60"  width="10" height="240" rx="5" style="animation:eq 1.4s ease-in-out -0.96s infinite;"/>
        <rect class="bar" x="288"  y="132" width="10" height="96"  rx="5" style="animation:eq 1.4s ease-in-out -1.08s infinite;"/>
        <rect class="bar" x="310"  y="102" width="10" height="156" rx="5" style="animation:eq 1.4s ease-in-out -1.20s infinite;"/>
        <rect class="bar" x="332"  y="144" width="10" height="72"  rx="5" style="animation:eq 1.4s ease-in-out -1.32s infinite;"/>
        <rect class="bar" x="354"  y="78"  width="10" height="204" rx="5" style="animation:eq 1.4s ease-in-out -0.06s infinite;"/>
        <rect class="bar" x="376"  y="116" width="10" height="128" rx="5" style="animation:eq 1.4s ease-in-out -0.18s infinite;"/>
        <rect class="bar" x="398"  y="156" width="10" height="48"  rx="5" style="animation:eq 1.4s ease-in-out -0.30s infinite;"/>
        <rect class="bar" x="420"  y="90"  width="10" height="180" rx="5" style="animation:eq 1.4s ease-in-out -0.42s infinite;"/>
        <rect class="bar" x="442"  y="128" width="10" height="104" rx="5" style="animation:eq 1.4s ease-in-out -0.54s infinite;"/>
        <rect class="bar" x="464"  y="66"  width="10" height="228" rx="5" style="animation:eq 1.4s ease-in-out -0.66s infinite;"/>
        <rect class="bar" x="486"  y="138" width="10" height="84"  rx="5" style="animation:eq 1.4s ease-in-out -0.78s infinite;"/>
        <rect class="bar" x="508"  y="106" width="10" height="148" rx="5" style="animation:eq 1.4s ease-in-out -0.90s infinite;"/>
        <rect class="bar" x="530"  y="148" width="10" height="64"  rx="5" style="animation:eq 1.4s ease-in-out -1.02s infinite;"/>
        <rect class="bar" x="552"  y="74"  width="10" height="212" rx="5" style="animation:eq 1.4s ease-in-out -1.14s infinite;"/>
        <rect class="bar" x="574"  y="122" width="10" height="116" rx="5" style="animation:eq 1.4s ease-in-out -1.26s infinite;"/>
