<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="three.js — JavaScript 3D library. A wireframe icosahedron slowly rotates in 3D space." preserveAspectRatio="xMidYMid meet">
  <title>three.js — JavaScript 3D library</title>
  <desc>Dark hero banner. A glowing wireframe icosahedron slowly tumbles and rotates in space beside the three.js wordmark and tagline.</desc>

  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1280" height="360" rx="20" ry="20"/></clipPath>

    <radialGradient id="bgGlow" cx="24%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#15243b"/>
      <stop offset="45%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="55%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#b98cff"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#6cc2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.88"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <style><![CDATA[
      .spin  { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
      .tumble{ transform-box: fill-box; transform-origin: center; animation: tumble 12s ease-in-out infinite; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .vtx   { animation: vtx 5s ease-in-out infinite; }
      .drift { animation: drift 9s ease-in-out infinite; }

      @keyframes spin   { to   { transform: rotate(360deg); } }
      @keyframes tumble { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(-0.62); } }
      @keyframes pulse  { 0%,100% { opacity:.55; transform: scale(.94);} 50% { opacity:1; transform: scale(1.06);} }
      @keyframes vtx    { 0%,100% { r:3.1; opacity:.85;} 50% { r:4.4; opacity:1;} }
      @keyframes drift  { 0%,100% { opacity:.20;} 50% { opacity:.55;} }

      @media (prefers-reduced-motion: reduce){
        .spin,.tumble,.pulse,.vtx,.drift{ animation:none; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1280" height="360" fill="#0d1117"/>
    <rect x="0" y="0" width="1280" height="360" fill="url(#bgGlow)"/>

    <!-- faint depth grid -->
    <g stroke="#243a5e" stroke-width="1" class="drift">
      <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280" opacity="0.5"/>
      <path d="M160 0 V360 M420 0 V360 M680 0 V360 M940 0 V360 M1200 0 V360" opacity="0.35"/>
    </g>

    <!-- floating particles in space -->
    <g fill="#6cc2ff">
      <circle cx="120" cy="70" r="1.6" opacity=".5"><animate attributeName="opacity" values=".2;.7;.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="300" r="1.4" opacity=".4"><animate attributeName="opacity" values=".6;.15;.6" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="250" r="1.2" opacity=".4"><animate attributeName="opacity" values=".2;.6;.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="60" r="1.3" opacity=".4"><animate attributeName="opacity" values=".55;.2;.55" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="510" cy="140" r="1.1" opacity=".35"><animate attributeName="opacity" values=".2;.5;.2" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ===== ROTATING WIREFRAME ICOSAHEDRON ===== -->
    <!-- center of polyhedron: (270,180). Outer group = spin (planar), inner = tumble (fake depth) -->
    <g class="spin">
      <g class="tumble">
        <!-- inner glow core -->
        <circle cx="270" cy="180" r="120" fill="url(#core)" class="pulse"/>

        <!-- edges -->
        <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.9">
          <path d="M333.1 166 L304.8 280.2 M333.1 166 L346.3 87.6 M333.1 166 L239.4 87.6 M333.1 166 L386.7 206.6 M333.1 166 L213.8 206.6
                   M235.2 79.8 L206.9 194 M235.2 79.8 L346.3 87.6 M235.2 79.8 L239.4 87.6 M235.2 79.8 L326.2 153.4 M235.2 79.8 L153.3 153.4
                   M304.8 280.2 L300.6 272.4 M304.8 280.2 L193.7 272.4 M304.8 280.2 L386.7 206.6 M304.8 280.2 L213.8 206.6
                   M206.9 194 L300.6 272.4 M206.9 194 L193.7 272.4 M206.9 194 L326.2 153.4 M206.9 194 L153.3 153.4
                   M346.3 87.6 L239.4 87.6 M346.3 87.6 L386.7 206.6 M346.3 87.6 L326.2 153.4
                   M300.6 272.4 L193.7 272.4 M300.6 272.4 L386.7 206.6 M300.6 272.4 L326.2 153.4
                   M239.4 87.6 L213.8 206.6 M239.4 87.6 L153.3 153.4
                   M193.7 272.4 L213.8 206.6 M193.7 272.4 L153.3 153.4
                   M386.7 206.6 L326.2 153.4 M213.8 206.6 L153.3 153.4"/>
        </g>

        <!-- crisp edge overlay (thin, no blur) -->
        <g fill="none" stroke="#bfe6ff" stroke-width="1" stroke-linejoin="round" opacity="0.75">
          <path d="M333.1 166 L304.8 280.2 M333.1 166 L346.3 87.6 M333.1 166 L239.4 87.6 M333.1 166 L386.7 206.6 M333.1 166 L213.8 206.6
                   M235.2 79.8 L206.9 194 M235.2 79.8 L346.3 87.6 M235.2 79.8 L239.4 87.6 M235.2 79.8 L326.2 153.4 M235.2 79.8 L153.3 153.4
                   M304.8 280.2 L300.6 272.4 M304.8 280.2 L193.7 272.4 M304.8 280.2 L386.7 206.6 M304.8 280.2 L213.8 206.6
                   M206.9 194 L300.6 272.4 M206.9 194 L193.7 272.4 M206.9 194 L326.2 153.4 M206.9 194 L153.3 153.4
                   M346.3 87.6 L239.4 87.6 M346.3 87.6 L386.7 206.6 M346.3 87.6 L326.2 153.4
                   M300.6 272.4 L193.7 272.4 M300.6 272.4 L386.7 206.6 M300.6 272.4 L326.2 153.4
                   M239.4 87.6 L213.8 206.6 M239.4 87.6 L153.3 153.4
                   M193.7 272.4 L213.8 206.6 M193.7 272.4 L153.3 153.4
                   M386.7 206.6 L326.2 153.4 M213.8 206.6 L153.3 153.4"/>
        </g>

        <!-- vertices -->
        <g fill="#eaf6ff">
          <circle class="vtx" cx="333.1" cy="166"   r="3.1"/>
          <circle class="vtx" cx="235.2" cy="79.8"  r="3.1"/>
          <circle class="vtx" cx="304.8" cy="280.2" r="3.1"/>
          <circle class="vtx" cx="206.9" cy="194"   r="3.1"/>
          <circle class="vtx" cx="346.3" cy="87.6"  r="3.1"/>
          <circle class="vtx" cx="300.6" cy="272.4" r="3.1"/>
          <circle class="vtx" cx="239.4" cy="87.6"  r="3.1"/>
          <circle class="vtx" cx="193.7" cy="272.4" r="3.1"/>
          <circle class="vtx" cx="386.7" cy="206.6" r="3.1"/>
          <circle class="vtx" cx="326.2" cy="153.4" r="3.1"/>
          <circle class="vtx" cx="213.8" cy="206.6" r="3.1"/>
          <circle class="vtx" cx="153.3" cy="153.4" r="3.1"/>
        </g>
      </g>
    </g>

    <!-- scrim behind text -->
    <rect x="0" y="0" width="1280" height="360" fill="url(#scrim)"/>

    <!-- ===== WORDMARK ===== -->
    <g font-family="'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="560" y="182" font-size="104" font-weight="700" letter-spacing="-3" fill="#ffffff">three<tspan fill="#3aa0ff">.js</tspan></text>
      <text x="564" y="232" font-size="30" font-weight="500" letter-spacing="0.5" fill="#c6d4e6">JavaScript 3D library</text>
      <text x="564" y="278" font-size="19" font-weight="400" letter-spacing="0.3" fill="#7f93ad">Cross-browser WebGL / WebGPU rendering &#8212; scenes, meshes, materials &amp; lights.</text>
    </g>

    <!-- border stroke -->
    <rect x="1" y="1" width="1278" height="358" rx="19" ry="19" fill="none" stroke="#2a3a55" stroke-width="1.5"/>
  </g>
</svg>
