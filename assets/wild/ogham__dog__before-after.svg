<g class="content"><rect x="324" y="64" width="240" height="20" rx="10" fill="#3a434e"/><rect x="324" y="102" width="520" height="11" rx="5.5" fill="#262d36"/><rect x="324" y="126" width="440" height="11" rx="5.5" fill="#262d36"/><rect x="324" y="150" width="500" height="11" rx="5.5" fill="#262d36"/><rect x="324" y="174" width="360" height="11" rx="5.5" fill="#262d36"/><rect x="324" y="198" width="470" height="11" rx="5.5" fill="#262d36"/><rect x="324" y="222" width="300" height="11" rx="5.5" fill="#262d36"/></g>
