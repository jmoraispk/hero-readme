<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="dog: a plain README gains an animated hero" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"><title>dog — before → after</title>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.96"/><stop offset="0.4" stop-color="#0d1117" stop-opacity="0.82"/><stop offset="0.66" stop-color="#0d1117" stop-opacity="0.28"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.32" r="0.6"><stop offset="0" stop-color="#FBBF24" stop-opacity="0.4"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath><clipPath id="pg"><rect x="300" y="40" width="600" height="320" rx="12"/></clipPath></defs>
<style>.content{transform:translateY(112px)}.hero{opacity:1}@media(prefers-reduced-motion:no-preference){.content{animation:drop 7s ease-in-out infinite}.hero{animation:rise 7s ease-in-out infinite}}
@keyframes drop{0%,20%{transform:translateY(0)}40%,86%{transform:translateY(112px)}100%{transform:translateY(0)}}
@keyframes rise{0%,24%{opacity:0}40%,84%{opacity:1}96%,100%{opacity:0}}</style>
<rect width="1280" height="400" fill="#0d1117"/>
<rect x="300" y="40" width="600" height="320" rx="12" fill="#161b22" stroke="#2b333d" stroke-width="1.5"/>
